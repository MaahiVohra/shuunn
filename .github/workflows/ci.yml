name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify repo hygiene (no hardcoded sources or tracker URLs)
        run: npm run check:hygiene

      - name: TypeScript type-check
        run: npm run type-check

      - name: Setup aria2 binary
        run: node scripts/setup-aria2.mjs

      - name: Build frontend assets
        run: npm run build
